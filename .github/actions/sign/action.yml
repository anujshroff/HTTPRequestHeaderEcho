name: 'Sign HTTPRequestHeaderEcho.dll'
description: 'Download HTTPRequestHeaderEcho.dll, sign with Azure Trusted Signing, upload signed DLL'
inputs:
  AZURE_CLIENT_ID:
    required: true
  AZURE_TENANT_ID:
    required: true
  AZURE_SUBSCRIPTION_ID:
    required: true
  TRUSTED_SIGNING_ENDPOINT:
    required: true
  TRUSTED_SIGNING_ACCOUNT:
    required: true
  TRUSTED_SIGNING_CERTIFICATE_PROFILE:
    required: true

runs:
  using: 'composite'
  steps:
    - name: Download HTTPRequestHeaderEcho.dll
      uses: actions/download-artifact@v8
      with:
        name: httprequestheaderecho-dll
        path: ${{ github.workspace }}/to-sign

    - name: Azure Login
      uses: azure/login@v3
      with:
        client-id: ${{ inputs.AZURE_CLIENT_ID }}
        tenant-id: ${{ inputs.AZURE_TENANT_ID }}
        subscription-id: ${{ inputs.AZURE_SUBSCRIPTION_ID }}

    - name: Sign files with Artifact Signing
      uses: azure/artifact-signing-action@v2
      with:
        endpoint: ${{ inputs.TRUSTED_SIGNING_ENDPOINT }}
        signing-account-name: ${{ inputs.TRUSTED_SIGNING_ACCOUNT }}
        certificate-profile-name: ${{ inputs.TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
        files: ${{ github.workspace }}/to-sign/HTTPRequestHeaderEcho.dll
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256

    - name: Upload Signed HTTPRequestHeaderEcho.dll
      uses: actions/upload-artifact@v7
      with:
        name: httprequestheaderecho-dll-signed
        path: ${{ github.workspace }}/to-sign/HTTPRequestHeaderEcho.dll
        retention-days: 1
        if-no-files-found: error
